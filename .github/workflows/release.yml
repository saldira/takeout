# A tag `v<version>` (pushed by saldira's publish script) builds
# `saldira-verify` for five platforms and publishes them as a release, with
# SHA256SUMS and a GitHub build attestation per archive.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The x86_64 macOS binary is cross-built on an arm runner, which cannot
      # run its tests; the arm build beside it runs them on the same code.
      - if: ${{ !contains(matrix.target, 'x86_64-apple') }}
        run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo build --locked --release -p ledger-verify --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="saldira-verify-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/saldira-verify.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/saldira-verify" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            saldira-verify-*.tar.gz
            saldira-verify-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum saldira-verify-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/saldira-verify-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "saldira-verify $GITHUB_REF_NAME" --notes-file notes.md
